<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <style>
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }
    @keyframes ripple { 0%{r:5;opacity:0.7} 100%{r:12;opacity:0} }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
    .rip1 { animation: ripple 1.5s ease-out infinite; }
    .rip2 { animation: ripple 1.5s ease-out infinite 0.6s; }
  </style>
  <circle cx="12" cy="12" r="5" fill="none" stroke="white" stroke-width="1.2" class="rip1"/>
  <circle cx="12" cy="12" r="5" fill="none" stroke="white" stroke-width="1" class="rip2"/>
  <circle cx="12" cy="12" r="5" fill="white" class="pulse"/>
  <circle cx="12" cy="12" r="3" fill="white"/>
</svg>

name: Daily Archive

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webarchiver/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run the archiver
        run: |
          cd webarchiver
          python crawler/crawler.py

      - name: Commit and push new archive data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "daily archive snapshot $(date +'%Y-%m-%d')"
          git push
